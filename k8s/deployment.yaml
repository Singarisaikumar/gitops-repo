apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
  namespace: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-app
  template:
    metadata:
      labels:
        app: devsecops-app
    spec:
      containers:
      - name: node-webserver
        image: docker.io/saikumar718/scratch-app:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-service
  namespace: webapp
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
  selector:
    app: devsecops-app
