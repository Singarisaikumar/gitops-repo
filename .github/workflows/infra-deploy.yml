name: "Wipe and Clean AWS Cloud"

on:
  push:
    branches:
      - main

jobs:
  aws-cleanup:
    name: "Execute Complete Resource Destruction"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Authenticate with AWS Cloud Programmatically
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 2. Run Automated Cloud Wipe Script
        run: |
          echo "🔍 Searching for automated EC2 instances..."
          INSTANCE_IDS=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=Automated-DevOps-Server" "Name=instance-state-name,Values=running,pending" --query "Reservations[*].Instances[*].InstanceId" --output text)
          
          if [ ! -z "$INSTANCE_IDS" ]; then
            echo "🛑 Terminating running servers: $INSTANCE_IDS"
            aws ec2 terminate-instances --instance-ids $INSTANCE_IDS
            echo "⏳ Waiting for server shutdown to finish..."
            aws ec2 wait instance-terminated --instance-ids $INSTANCE_IDS
          else
            echo "✅ No active automated servers found."
          fi

          echo "🔍 Searching for custom automation firewalls..."
          SG_IDS=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=devops-automated-sg*" --query "SecurityGroups[*].GroupId" --output text)
          
          for sg in $SG_IDS; do
            echo "🗑️ Deleting security group: $sg"
            aws ec2 delete-security-group --group-id $sg 2>/dev/null || echo "⚠️ Group is clearing dependencies, skipping..."
          done
          
          echo "=========================================================="
          echo "🧹 WIPE COMPLETE! Your AWS account slate is clean."
          echo "=========================================================="
